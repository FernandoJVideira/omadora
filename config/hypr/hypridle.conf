general {
    lock_cmd = skeinctl session lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = skeinctl display brightness on
    inhibit_sleep = 3
}

# Start screensaver after 2.5 minutes
listener {
    timeout = 150
    on-timeout = qs -c skein ipc call lock isLocked | grep -qx true || skeinctl session screensaver
}

# Lock system after 5 minutes (screensaver resets idle timer, so have to just do half + 2s margin)
listener {
    timeout = 152
    on-timeout = loginctl lock-session
}

# Screen off after 7.5 minutes
listener {
    timeout = 154
    on-timeout = skeinctl display brightness off
    on-resume = skeinctl display brightness on
}
